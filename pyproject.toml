[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "animatrix"
version = "0.1.0"
description = "Trzyetapowa produkcja animowanych explainerów edukacyjnych (Manim + ElevenLabs + Claude)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2",
    "pyyaml>=6",
    "python-dotenv>=1",
]

[project.optional-dependencies]
render = [
    "manim>=0.19.0",
    "manim-voiceover[elevenlabs]>=0.3.7",
    "manim-chemistry>=0.4.4",
]
maps = [
    "geopandas>=1.0",
    "shapely>=2.0",
]
dev = [
    "pytest>=8",
]

[project.scripts]
animatrix = "animatrix.cli:main"

[tool.setuptools.packages.find]
include = ["animatrix*"]

[tool.setuptools.package-data]
animatrix = [
    "runtime/*.py",
    "demo/*.yaml",
    "demo/*.py",
    "demo/*.md",
    "demo/scenes/*.py",
    "demo/assets/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: renderuje naprawdę przez Manima (kilkadziesiąt sekund)",
]
