<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>animatrix</title>
<style>
:root {
  --bg: #0e1015;
  --panel: #151922;
  --panel-2: #1b2029;
  --linia: #262d3a;
  --tekst: #e6e9f0;
  --tekst-2: #98a1b3;
  --akcent: #7c3aed;
  --alarm: #dc2626;
  --ok: #10b981;
  --warn: #f59e0b;
  --r: 10px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font: 14px/1.5 Inter, ui-sans-serif, system-ui, sans-serif;
  background: var(--bg);
  color: var(--tekst);
  height: 100vh;
  display: flex;
  flex-direction: column;
}
button, select, input, textarea {
  font: inherit;
  color: inherit;
  background: var(--panel-2);
  border: 1px solid var(--linia);
  border-radius: 8px;
  padding: 6px 10px;
}
button { cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--akcent); }
button:disabled { opacity: .45; cursor: default; }
button.glowny { background: var(--akcent); border-color: var(--akcent); font-weight: 600; }
button.cichy { background: transparent; }
textarea { width: 100%; resize: vertical; font-family: ui-monospace, monospace; font-size: 13px; }

header {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px; border-bottom: 1px solid var(--linia); background: var(--panel);
}
header .marka { font-weight: 700; letter-spacing: -.02em; }
header .rozpychacz { flex: 1; }
header label { color: var(--tekst-2); font-size: 12px; margin-right: 4px; }

main { flex: 1; display: grid; grid-template-columns: 260px 1fr 380px; min-height: 0; }
section { min-height: 0; overflow: auto; padding: 12px; }
#lista { border-right: 1px solid var(--linia); background: var(--panel); }
#prawa { border-left: 1px solid var(--linia); background: var(--panel); }
#srodek { display: flex; flex-direction: column; align-items: center; gap: 12px; }

h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--tekst-2); margin: 0 0 8px; font-weight: 600; }
h3 { font-size: 13px; margin: 16px 0 6px; }

.segment {
  padding: 8px 10px; border: 1px solid var(--linia); border-radius: var(--r);
  margin-bottom: 6px; cursor: pointer; background: var(--panel-2);
}
.segment:hover { border-color: #3a4459; }
.segment.wybrany { border-color: var(--akcent); background: #1e1830; }
.segment .gora { display: flex; gap: 6px; align-items: center; font-size: 11px; color: var(--tekst-2); }
.segment .id { font-family: ui-monospace, monospace; }
.segment .tresc { margin-top: 3px; font-size: 12px; color: var(--tekst); overflow: hidden;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.kropka { width: 7px; height: 7px; border-radius: 50%; background: var(--tekst-2); flex: none; }
.kropka.ok { background: var(--ok); }
.kropka.blad { background: var(--alarm); }
.kropka.nieaktualny { background: var(--warn); }

/* Kadr trzyma proporcje formatu nawet zanim cokolwiek się wyrenderuje —
   inaczej nakładka stref bezpiecznych pokazywałaby nieprawdę. */
#scena { position: relative; background: #000; border-radius: var(--r); overflow: hidden;
  border: 1px solid var(--linia); height: calc(100vh - 210px); }
#scena img, #scena video { display: block; width: 100%; height: 100%; object-fit: contain; }
#pusto { color: var(--tekst-2); padding: 40px; text-align: center; }
#strefy { position: absolute; inset: 0; pointer-events: none; display: none; }
#strefy.wlaczone { display: block; }
#strefy div { position: absolute; background: rgba(220,38,38,.22); }
#strefy .ramka { background: none; border: 1px dashed rgba(255,255,255,.45); }

.pasek { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
.postep { width: 100%; height: 4px; background: var(--panel-2); border-radius: 2px; overflow: hidden; }
.postep i { display: block; height: 100%; background: var(--akcent); width: 0; transition: width .2s; }
.postep.nieokreslony i { width: 40% !important; animation: suw 1.1s ease-in-out infinite alternate; }
@keyframes suw { from { margin-left: 0 } to { margin-left: 60% } }

.pole { margin-bottom: 8px; }
.pole label { display: block; font-size: 11px; color: var(--tekst-2); margin-bottom: 3px; }
.pole input, .pole select, .pole textarea { width: 100%; }
.uchybienie { padding: 6px 8px; border-radius: 8px; margin-bottom: 4px; font-size: 12px;
  border-left: 3px solid var(--warn); background: var(--panel-2); }
.uchybienie.blad { border-left-color: var(--alarm); }
.komunikat { font-size: 12px; color: var(--tekst-2); min-height: 18px; }
.komunikat.blad { color: var(--alarm); }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: none; align-items: center;
  justify-content: center; padding: 24px; z-index: 10; }
.modal.otwarty { display: flex; }
.modal .okno { background: var(--panel); border: 1px solid var(--linia); border-radius: 14px;
  padding: 18px; width: min(760px, 100%); max-height: 90vh; overflow: auto; }
.kawalek { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; border-bottom: 1px solid var(--linia); }
.kawalek textarea { min-height: 44px; }
.kawalek .miara { font-size: 11px; color: var(--tekst-2); white-space: nowrap; padding-top: 8px; }
code { font-family: ui-monospace, monospace; font-size: 12px; color: var(--tekst-2); }
</style>
</head>
<body>

<header>
  <span class="marka">animatrix</span>
  <select id="wybor-projektu"></select>
  <label>format</label><select id="wybor-formatu"></select>
  <label>motyw</label><select id="wybor-motywu"></select>
  <span class="rozpychacz"></span>
  <label><input type="checkbox" id="pokaz-strefy" checked> strefy bezpieczne</label>
  <button id="btn-wklej">Wklej scenariusz</button>
  <span id="glos" class="komunikat"></span>
</header>

<main>
  <section id="lista">
    <h2>Segmenty</h2>
    <div id="segmenty"></div>
  </section>

  <section id="srodek">
    <div id="scena"><div id="pusto">Wybierz segment</div><div id="strefy"></div></div>
    <div class="pasek">
      <button id="btn-podglad">Podgląd klatki</button>
      <button id="btn-render" class="glowny">Render z lektorem</button>
      <button id="btn-anuluj" disabled>Anuluj</button>
      <button id="btn-akceptuj" class="cichy">Akceptuj</button>
    </div>
    <div class="postep" id="postep"><i></i></div>
    <div class="komunikat" id="komunikat"></div>
  </section>

  <section id="prawa">
    <h2>Segment</h2>
    <div class="pole"><label>Narracja</label><textarea id="narracja" rows="3" readonly></textarea></div>
    <div class="pole"><label>Szablon</label><select id="wybor-szablonu"></select></div>
    <div id="opis-szablonu" class="komunikat"></div>

    <h3>Nagłówek sekcji</h3>
    <div class="pasek" style="justify-content:flex-start">
      <input id="sekcja-numer" type="number" min="1" style="width:70px" placeholder="nr">
      <input id="sekcja-etykieta" placeholder="etykieta (puste = brak paska)" style="flex:1">
    </div>

    <h3>Parametry</h3>
    <textarea id="parametry" rows="16" spellcheck="false"></textarea>
    <div class="pasek" style="justify-content:flex-start; margin-top:6px">
      <button id="btn-zapisz" class="glowny">Zapisz</button>
      <button id="btn-przyklad" class="cichy">Wstaw przykład</button>
      <button id="btn-sprawdz" class="cichy">Sprawdź układ</button>
    </div>
    <div id="wynik-zapisu" class="komunikat"></div>

    <h3>Układ</h3>
    <div id="uchybienia" class="komunikat">—</div>
  </section>
</main>

<div class="modal" id="modal-wklej">
  <div class="okno">
    <h2>Wklej scenariusz</h2>
    <p class="komunikat">Tekst z Claude albo GPT. Narzędzie potnie go na segmenty — podział możesz poprawić przed zapisem.</p>
    <textarea id="wklejka" rows="8" placeholder="Wklej tutaj cały scenariusz…"></textarea>
    <div class="pasek" style="justify-content:flex-start; margin:8px 0">
      <button id="btn-podziel" class="glowny">Podziel</button>
      <span id="miara-podzialu" class="komunikat"></span>
    </div>
    <div id="propozycja"></div>
    <div class="pasek" style="justify-content:flex-end; margin-top:12px">
      <button id="btn-anuluj-wklej" class="cichy">Anuluj</button>
      <button id="btn-zapisz-scenariusz" class="glowny" disabled>Zapisz scenariusz</button>
    </div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const stan = { info: null, projekt: null, wybrany: null, zadanie: null, kawalki: [], zrodlo: null };

async function api(sciezka, opcje = {}) {
  const r = await fetch(sciezka, {
    headers: { "Content-Type": "application/json" },
    ...opcje,
    body: opcje.body ? JSON.stringify(opcje.body) : undefined,
  });
  const tekst = await r.text();
  const dane = tekst ? JSON.parse(tekst) : null;
  if (!r.ok) throw new Error(dane?.detail ?? r.statusText);
  return dane;
}

function opcje(select, wartosci, wybrana) {
  select.innerHTML = "";
  for (const w of wartosci) {
    const o = document.createElement("option");
    o.value = typeof w === "string" ? w : w.wartosc;
    o.textContent = typeof w === "string" ? w : w.etykieta;
    select.append(o);
  }
  if (wybrana != null) select.value = wybrana;
}

// --- start ---------------------------------------------------------------
async function start() {
  stan.info = await api("/api/info");
  opcje($("#wybor-formatu"), stan.info.formaty.map((f) => ({ wartosc: f.nazwa, etykieta: `${f.nazwa} · ${f.opis}` })));
  opcje($("#wybor-motywu"), stan.info.motywy);
  opcje($("#wybor-szablonu"), [...stan.info.szablony.map((s) => s.nazwa), "kod"]);
  $("#glos").textContent = stan.info.glos.gotowy
    ? `lektor: ${stan.info.glos.silnik}`
    : "lektor: cisza (brak klucza ElevenLabs)";

  const projekty = await api("/api/projekty");
  if (!projekty.length) {
    $("#pusto").textContent = "Brak projektów. Załóż jeden: animatrix new \"Nazwa\"";
    return;
  }
  opcje($("#wybor-projektu"), projekty.map((p) => ({ wartosc: p.nazwa, etykieta: p.nazwa })));
  await wczytajProjekt(projekty[0].nazwa);
}

async function wczytajProjekt(nazwa) {
  stan.projekt = await api(`/api/projekty/${nazwa}`);
  $("#wybor-formatu").value = stan.projekt.format;
  $("#wybor-motywu").value = stan.projekt.motyw;
  rysujSegmenty();
  rysujStrefy();
  const nadal = stan.projekt.segmenty.find((s) => s.id === stan.wybrany?.id);
  wybierz(nadal ?? stan.projekt.segmenty[0]);
}

function rysujSegmenty() {
  const cel = $("#segmenty");
  cel.innerHTML = "";
  for (const seg of stan.projekt.segmenty) {
    const el = document.createElement("div");
    el.className = "segment" + (stan.wybrany?.id === seg.id ? " wybrany" : "");
    const klasa = seg.blad_specu ? "blad" : seg.nieaktualny ? "nieaktualny" : seg.render_roboczy ? "ok" : "";
    el.innerHTML = `<div class="gora"><span class="kropka ${klasa}"></span>
      <span class="id">${seg.id}</span><span>${seg.szablon ?? "—"}</span></div>
      <div class="tresc"></div>`;
    el.querySelector(".tresc").textContent = seg.narracja;
    el.onclick = () => wybierz(seg);
    cel.append(el);
  }
}

function rysujStrefy() {
  const k = stan.projekt.kadr;
  $("#scena").style.aspectRatio = `${k.szerokosc_px} / ${k.wysokosc_px}`;
  const u = k.bezpieczny_ulamek;
  $("#strefy").innerHTML = `
    <div style="top:0;left:0;right:0;height:${u.gora * 100}%"></div>
    <div style="bottom:0;left:0;right:0;height:${u.dol * 100}%"></div>
    <div style="top:0;bottom:0;left:0;width:${u.lewo * 100}%"></div>
    <div style="top:0;bottom:0;right:0;width:${u.prawo * 100}%"></div>
    <div class="ramka" style="top:${u.gora * 100}%;bottom:${u.dol * 100}%;left:${u.lewo * 100}%;right:${u.prawo * 100}%"></div>`;
}

function wybierz(seg) {
  if (!seg) return;
  stan.wybrany = seg;
  rysujSegmenty();
  $("#narracja").value = seg.narracja;
  $("#wybor-szablonu").value = seg.szablon ?? stan.info.szablony[0].nazwa;
  $("#parametry").value = JSON.stringify(seg.parametry ?? {}, null, 2);
  $("#sekcja-numer").value = seg.sekcja?.numer ?? "";
  $("#sekcja-etykieta").value = seg.sekcja?.etykieta ?? "";
  $("#uchybienia").textContent = seg.blad_specu ? `Spec nie do wczytania: ${seg.blad_specu}` : "—";
  $("#wynik-zapisu").textContent = "";
  opisSzablonu();
  pokazPodglad(seg);
}

function opisSzablonu() {
  const s = stan.info.szablony.find((x) => x.nazwa === $("#wybor-szablonu").value);
  $("#opis-szablonu").textContent = s ? s.opis : "Własna klasa w Pythonie: {plik, klasa}.";
}

function pokazPodglad(seg) {
  const scena = $("#scena");
  [...scena.children].forEach((c) => { if (c.id !== "strefy") c.remove(); });
  let el;
  if (seg.render_roboczy) {
    el = document.createElement("video");
    el.src = `/api/projekty/${stan.projekt.nazwa}/plik/${seg.render_roboczy}?v=${Date.now()}`;
    el.controls = true;
    el.loop = true;
  } else if (seg.podglad) {
    el = document.createElement("img");
    el.src = `/api/projekty/${stan.projekt.nazwa}/plik/${seg.podglad}?v=${Date.now()}`;
  } else {
    el = document.createElement("div");
    el.id = "pusto";
    el.textContent = "Brak podglądu — kliknij „Podgląd klatki”.";
  }
  scena.prepend(el);
}

function pokazObraz(url) {
  const scena = $("#scena");
  [...scena.children].forEach((c) => { if (c.id !== "strefy") c.remove(); });
  const img = document.createElement("img");
  img.src = `${url}?v=${Date.now()}`;
  scena.prepend(img);
}

function komunikat(tekst, blad = false) {
  const el = $("#komunikat");
  el.textContent = tekst;
  el.classList.toggle("blad", blad);
}

// --- akcje ---------------------------------------------------------------
$("#wybor-projektu").onchange = (e) => wczytajProjekt(e.target.value);
$("#pokaz-strefy").onchange = (e) => $("#strefy").classList.toggle("wlaczone", e.target.checked);
$("#pokaz-strefy").onchange({ target: $("#pokaz-strefy") });
$("#wybor-szablonu").onchange = opisSzablonu;

for (const [id, pole] of [["#wybor-formatu", "format_wideo"], ["#wybor-motywu", "motyw"]]) {
  $(id).onchange = async (e) => {
    await api(`/api/projekty/${stan.projekt.nazwa}`, { method: "PATCH", body: { [pole]: e.target.value } });
    await wczytajProjekt(stan.projekt.nazwa);
    komunikat(`Zmieniono ${pole} na ${e.target.value}. Rendery są nieaktualne.`);
  };
}

$("#btn-przyklad").onclick = () => {
  const s = stan.info.szablony.find((x) => x.nazwa === $("#wybor-szablonu").value);
  if (s) $("#parametry").value = JSON.stringify(s.przyklad, null, 2);
};

$("#btn-zapisz").onclick = async () => {
  const wynik = $("#wynik-zapisu");
  let parametry;
  try {
    parametry = JSON.parse($("#parametry").value || "{}");
  } catch (e) {
    wynik.textContent = `JSON nie do sparsowania: ${e.message}`;
    wynik.classList.add("blad");
    return;
  }
  const etykieta = $("#sekcja-etykieta").value.trim();
  try {
    await api(`/api/projekty/${stan.projekt.nazwa}/sceny/${stan.wybrany.id}`, {
      method: "PUT",
      body: {
        szablon: $("#wybor-szablonu").value,
        parametry,
        sekcja: etykieta ? { numer: Number($("#sekcja-numer").value || 1), etykieta } : null,
      },
    });
    wynik.classList.remove("blad");
    wynik.textContent = "Zapisano.";
    await wczytajProjekt(stan.projekt.nazwa);
    sprawdzUklad();
  } catch (e) {
    wynik.classList.add("blad");
    wynik.textContent = e.message;
  }
};

async function sprawdzUklad() {
  const cel = $("#uchybienia");
  cel.textContent = "mierzę…";
  try {
    const d = await api(`/api/projekty/${stan.projekt.nazwa}/sceny/${stan.wybrany.id}/uklad`);
    if (d.blad) { cel.textContent = d.blad.split("\n").pop(); return; }
    if (!d.uchybienia.length) { cel.textContent = `Bez zastrzeżeń · ${d.takty} taktów`; return; }
    cel.innerHTML = d.uchybienia
      .map((u) => `<div class="uchybienie ${u.waga}"><b>${u.element}</b> — ${u.opis}</div>`)
      .join("");
  } catch (e) {
    cel.textContent = e.message;
  }
}
$("#btn-sprawdz").onclick = sprawdzUklad;

$("#btn-podglad").onclick = async () => {
  komunikat("renderuję klatkę…");
  try {
    const d = await api(`/api/projekty/${stan.projekt.nazwa}/sceny/${stan.wybrany.id}/podglad`, { method: "POST" });
    pokazObraz(`/api/projekty/${stan.projekt.nazwa}/plik/${d.plik}`);
    komunikat("");
  } catch (e) {
    komunikat(e.message, true);
  }
};

$("#btn-akceptuj").onclick = async () => {
  await api(`/api/projekty/${stan.projekt.nazwa}/sceny/${stan.wybrany.id}/akceptuj`, { method: "POST" });
  komunikat(`${stan.wybrany.id} zaakceptowany.`);
  await wczytajProjekt(stan.projekt.nazwa);
};

$("#btn-render").onclick = async () => {
  try {
    const z = await api(`/api/projekty/${stan.projekt.nazwa}/sceny/${stan.wybrany.id}/render`, { method: "POST" });
    sledz(z.id);
  } catch (e) {
    komunikat(e.message, true);
  }
};

$("#btn-anuluj").onclick = async () => {
  if (!stan.zadanie) return;
  await api(`/api/zadania/${stan.zadanie}`, { method: "DELETE" });
  komunikat("anuluję…");
};

function sledz(zadanieId) {
  stan.zadanie = zadanieId;
  $("#btn-render").disabled = true;
  $("#btn-anuluj").disabled = false;
  stan.zrodlo?.close();
  const zrodlo = new EventSource(`/api/zadania/${zadanieId}/strumien`);
  stan.zrodlo = zrodlo;

  zrodlo.addEventListener("postep", (e) => {
    const d = JSON.parse(e.data);
    const pasek = $("#postep");
    pasek.classList.toggle("nieokreslony", d.postep == null);
    pasek.firstElementChild.style.width = `${(d.postep ?? 0) * 100}%`;
    komunikat(d.komunikat || "renderuję…");
  });

  zrodlo.addEventListener("koniec", async (e) => {
    const d = JSON.parse(e.data);
    zrodlo.close();
    stan.zadanie = null;
    stan.zrodlo = null;
    $("#btn-render").disabled = false;
    $("#btn-anuluj").disabled = true;
    $("#postep").classList.remove("nieokreslony");
    $("#postep").firstElementChild.style.width = d.stan === "gotowe" ? "100%" : "0";
    if (d.stan === "blad") komunikat(String(d.blad).split("\n").slice(-3).join(" "), true);
    else if (d.stan === "anulowane") komunikat("Render przerwany.");
    else komunikat(`Gotowe${d.wynik?.sekundy ? ` · ${d.wynik.sekundy.toFixed(1)} s` : ""}`);
    await wczytajProjekt(stan.projekt.nazwa);
  });
}

// --- wklejanie scenariusza -----------------------------------------------
$("#btn-wklej").onclick = () => $("#modal-wklej").classList.add("otwarty");
$("#btn-anuluj-wklej").onclick = () => $("#modal-wklej").classList.remove("otwarty");

$("#btn-podziel").onclick = async () => {
  const d = await api("/api/podzial", { method: "POST", body: { tekst: $("#wklejka").value } });
  stan.kawalki = d.segmenty.map((s) => s.narracja);
  $("#miara-podzialu").textContent = `${d.segmenty.length} segmentów · ${d.razem_znakow} znaków · ~${d.razem_sekund} s`;
  rysujPropozycje();
  $("#btn-zapisz-scenariusz").disabled = !stan.kawalki.length;
};

function rysujPropozycje() {
  const cel = $("#propozycja");
  cel.innerHTML = "";
  stan.kawalki.forEach((tekst, i) => {
    const wiersz = document.createElement("div");
    wiersz.className = "kawalek";
    wiersz.innerHTML = `<span class="miara">s${String(i + 1).padStart(2, "0")}</span>
      <textarea rows="2"></textarea>
      <button class="cichy" title="scal z następnym">↧</button>
      <button class="cichy" title="usuń">×</button>`;
    const pole = wiersz.querySelector("textarea");
    pole.value = tekst;
    pole.oninput = () => { stan.kawalki[i] = pole.value; };
    const [scal, usun] = wiersz.querySelectorAll("button");
    scal.disabled = i === stan.kawalki.length - 1;
    scal.onclick = () => {
      stan.kawalki.splice(i, 2, `${stan.kawalki[i]} ${stan.kawalki[i + 1]}`.trim());
      rysujPropozycje();
    };
    usun.onclick = () => { stan.kawalki.splice(i, 1); rysujPropozycje(); };
    cel.append(wiersz);
  });
}

$("#btn-zapisz-scenariusz").onclick = async () => {
  try {
    await api(`/api/projekty/${stan.projekt.nazwa}/scenariusz`, {
      method: "PUT",
      body: { narracje: stan.kawalki },
    });
    $("#modal-wklej").classList.remove("otwarty");
    await wczytajProjekt(stan.projekt.nazwa);
    komunikat(`Zapisano ${stan.kawalki.length} segmentów. Przypisz im szablony.`);
  } catch (e) {
    komunikat(e.message, true);
  }
};

start().catch((e) => { $("#pusto").textContent = e.message; });
</script>
</body>
